name: "Test"
run-name: "Run tests for ${{ github.actor }}"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # release.yml calls this at the tag, so the suite guarding main is exactly the
  # suite guarding a release.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pinned images, never `-latest` -- test_ci.py enforces it.
        os: [ubuntu-26.04]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The page is served from a path built on the filesystem, so one platform
          # that spells a path differently runs the same suite.
          - os: macos-26
            python-version: "3.13"

    steps:
      - name: Check out repository code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The pen's coordinate maths is tested by node, not by pytest.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install
        run: pip install -e ".[dev]" flake8

      - name: Lint
        # Pyflakes-class checks only, as zrb does.
        run: flake8 --select=F src/board tests test_ci.py

      - name: Check the CI configuration
        run: python test_ci.py

      - name: Test the board
        run: python -m pytest -q

      - name: Test the pen
        run: node --test "tests-js/*.test.js"
