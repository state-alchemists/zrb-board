<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>board</title>
    <link rel="stylesheet" href="/static/board.css" />
  </head>
  <body>
    <header class="top">
      <a href="/">board</a>
      <span class="rev" id="rev"></span>
      <span class="spacer"></span>
      <button id="draw" type="button">ink</button>
      <button id="edit" type="button">edit markdown</button>
      <button id="save" type="button">save</button>
      <button id="notify" type="button">Mark for next message</button>
    </header>

    <div id="tools">
      <button type="button" data-tool="pen">✎ pen</button>
      <button type="button" data-tool="line">╲ line</button>
      <button type="button" data-tool="arrow">↘ arrow</button>
      <button type="button" data-tool="rect">▭ box</button>
      <button type="button" data-tool="ellipse">◯ circle</button>
      <button type="button" data-tool="text">T words</button>
      <button type="button" data-tool="erase">⌫ erase</button>
      <span class="hint">drag to draw · Esc closes the box</span>
    </div>

    <div id="banner"></div>

    <div id="layout">
      <div>
        <div class="paper">
          <article id="article"></article>
          <svg id="ink" aria-hidden="true"></svg>
        </div>
        <textarea id="editor" spellcheck="false"></textarea>
      </div>
      <aside id="rail">
        <div id="orphans"></div>
      </aside>
    </div>

    <div id="compose">
      <textarea placeholder="what do you want to say about this?"></textarea>
      <div class="row">
        <button id="compose-cancel" type="button">cancel</button>
        <button id="compose-save" type="button">put it down</button>
      </div>
    </div>

    <div id="toast"></div>
    <script src="/static/vendor/mermaid.min.js" defer></script>
    <script type="module" src="/static/board.js"></script>
  </body>
</html>
