[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zrb-board"
version = "0.2.2"
description = "A turn-based markdown board with annotated margins, for a human and a coding agent"
readme = "README.md"
# The same licence zrb itself declares, and a file to go with it: the identifier alone
# leaves PyPI's licence field empty.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "markdown-it-py>=3.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# httpx drives fastapi's TestClient, so it is a test dependency, not a runtime one.
# pydantic-ai builds the schema a tool's signature becomes, and the validator a call's
# arguments pass before the body runs -- the two things a `purpose` has to survive -- so the
# tools are tested against it. Nothing under `src/` imports it, and the board runs, and
# `zrb` loads the tools, without it.
dev = ["httpx>=0.27", "pydantic-ai-slim>=2.65", "pytest>=8"]

[project.scripts]
zrb-board = "board.app:main"

[project.urls]
Homepage = "https://github.com/state-alchemists/zrb-board"

[tool.setuptools.packages.find]
where = ["src"]

# `static/*` stops at the directory: the vendored Mermaid bundle sits one level deeper,
# and a wheel built without it opens the board with every diagram reduced to a code block.
[tool.setuptools.package-data]
board = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
