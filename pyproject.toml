[project]
name = "zrb-board"
version = "0.1.0"
description = "A turn-based markdown board with annotated margins, for a human and a coding agent."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "markdown-it-py>=3.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
zrb-board = "board.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
board = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
